version: 2
before:
  hooks:
    - go mod tidy
builds:
  - id: airgradient_exporter
    main: ./
    env:
      - CGO_ENABLED=0
    binary: airgradient_exporter
    ldflags:
      - -s -w -X main.build={{.Version}}
      - -X go.szostok.io/version.version={{.Version}}
      - -X go.szostok.io/version.buildDate={{.Date}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
release:
  github:
    owner: kmulvey
    name: airgradient_exporter
  # Whether to remove existing draft releases with the same name before creating
  replace_existing_draft: true
  # Whether to remove an artifact that already exists.
  replace_existing_artifacts: true
archives:
  - id: dist
    ids:
      - airgradient_exporter
    name_template: >-
      {{ .ProjectName }}_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else if eq .Arch "386" }}i386 {{- else }}{{ .Arch }}{{ end }}
    files:
      - airgradient_exporter.service
      - LICENSE
      - grafana-classic.json
      - grafana-v1.json
      - grafana-v2.json
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: >-
    {{- if .IsSnapshot -}}

      {{ incpatch .Version }}-snapshot
    {{- else -}}

      {{ .Version }}
    {{- end -}}
nfpms:
  # note that this is an array of nfpm configs
  - # ID of the nfpm config, must be unique.
    id: airgradient_exporter
    package_name: airgradient_exporter
    ids:
      - airgradient_exporter
    vendor: Kevin Mulvey
    homepage: https://github.com/kmulvey/airgradient_exporter
    maintainer: "Kevin Mulvey"
    description: |-
      Prometheus Exporter for AirGradient air quality monitors. Exposes device data as Prometheus metrics.
    license: MIT
    formats:
      - apk
      - deb
      - rpm
      - termux.deb
      - archlinux
    provides:
      - airgradient_exporter
    bindir: /usr/bin
    contents:
      - src: airgradient_exporter.service
        dst: /etc/systemd/system/airgradient_exporter.service
    scripts:
      postinstall: scripts/postinstall.sh
      preremove: scripts/preremove.sh
    # Custom configuration applied only to the RPM packager.
    rpm:
      group: root
      compression: lzma
